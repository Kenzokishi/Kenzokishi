<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Pedro Kenzo. I build AI agents, WhatsApp automations and security tooling for LLM apps.">
<style>@font-face{font-family:'AX';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'AR';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'AS';src:url(data:font/woff2;base64,) format('woff2')}
.n{font:118px 'AX',Arial Black,Arial,sans-serif;fill:#ffffff;letter-spacing:-3px}
.s{font:34px 'AR',Helvetica,Arial,sans-serif;fill:#ffffff}
.m{font:20px 'AR',Helvetica,Arial,sans-serif;fill:#9a9a9a}
.t{font:20px 'AS',Helvetica,Arial,sans-serif;fill:#fff}
.scan{animation:sweep 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(0);opacity:0}6%{opacity:1}46%{transform:translateX(760px);opacity:1}52%,100%{transform:translateX(760px);opacity:0}}
@media (prefers-reduced-motion:reduce){.scan{animation:none;opacity:0}}
</style>
<rect width="1200" height="360" fill="#0e0e0e"/>
<rect x="0" y="0" width="1200" height="12" fill="#ffffff"/>
<text x="44" y="156" class="n">Pedro Kenzo</text>
<g class="scan"><rect x="40" y="56" width="4" height="122" fill="#ff2d4b"/></g>
<text x="48" y="222" class="s">I build AI agents, WhatsApp automations</text>
<text x="48" y="264" class="s">and security tooling for LLM apps.</text>
<rect x="48" y="292" width="1104" height="2" fill="#ffffff" opacity=".12"/>
<text x="48" y="318" class="m">Porto Velho, Brazil</text><text x="330" y="318" class="m">Computer Engineering student</text><text x="700" y="318" class="m">Python, TypeScript, n8n</text>
<rect x="1000" y="40" width="152" height="44" fill="#ff2d4b"/>
<text x="1076" y="69" class="t" text-anchor="middle">Open to work</text>
</svg>